
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Voice</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(145deg,#050812,#101d38,#070b15);
  color:white;
  padding:15px;
}

.app{
  max-width:460px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 2px 18px;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#ffd43b;
}

.online{
  background:#123321;
  color:#63ed99;
  border:1px solid #28633f;
  border-radius:20px;
  padding:7px 10px;
  font-size:11px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(145deg,#192946,#10192b);
  border:1px solid #304361;
  border-radius:24px;
  padding:23px;
  box-shadow:0 15px 40px #0009;
}

.hero h1{
  font-size:38px;
  line-height:1;
  margin-bottom:12px;
}

.hero h1 span{
  color:#ffd43b;
}

.hero p{
  color:#aebbd0;
  font-size:14px;
  line-height:1.5;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:17px 0;
}

.badge{
  background:#22314c;
  border:1px solid #354866;
  padding:7px 10px;
  border-radius:20px;
  font-size:10px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:9px;
  font-size:15px;
  font-weight:800;
}

.primary{
  background:#ffd43b;
  color:#111;
}

.secondary{
  background:#263653;
  color:white;
}

.card{
  background:#121e32;
  border:1px solid #293b5a;
  border-radius:18px;
  padding:15px;
  margin-top:13px;
}

.guard{
  display:flex;
  gap:12px;
  align-items:center;
}

.guardIcon{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#183b2a;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.small{
  color:#9facbf;
  font-size:12px;
  line-height:1.4;
  margin-top:4px;
}

.hidden{
  display:none;
}

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.room{
  color:#aebbd0;
  font-size:12px;
}

.guardStatus{
  background:#153526;
  color:#6ceb9b;
  padding:6px 9px;
  border-radius:8px;
  font-size:10px;
  font-weight:bold;
}

.board{
  width:100%;
  aspect-ratio:1;
  background:#e9e1d0;
  border-radius:18px;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(11,1fr);
  grid-template-rows:repeat(11,1fr);
  gap:2px;
}

.cell{
  background:#d5ccb9;
  border-radius:3px;
}

.path{
  background:#fffaf0;
}

.red{
  background:#e85b5b;
}

.green{
  background:#55ba7a;
}

.yellow{
  background:#e5bd48
